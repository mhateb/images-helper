services:
  imageshelper:
    build:
      context: .
      args:
        VITE_YM_ID: ${VITE_YM_ID:-}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://fitpix.ru}
    image: imageshelper:latest
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      STATIC_DIR: /app/client/dist
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://fitpix.ru}
      VITE_YM_ID: ${VITE_YM_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BUG_REPORT_TO: ${BUG_REPORT_TO:-maaaslanov@gmail.com}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
